<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Meine Rezepte</title>
<meta name="theme-color" content="#2f7a55">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Rezepte">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<link rel="icon" href="icons/icon-192.png">
<link rel="stylesheet" href="css/app.css">
</head>
<body>
<!--APP-START-->
<div class="app">
  <header class="top" id="top">
    <div class="titlebar">
      <div class="title-wrap">
        <h1>Rezepte</h1>
        <button type="button" class="sync-status" id="syncStatus" hidden aria-live="polite" title="Jetzt abgleichen"></button>
      </div>
      <div class="titlebar-actions">
        <button type="button" class="btn btn-quiet" id="btnCollections">Sammlungen</button>
        <button type="button" class="btn btn-primary" id="btnNew">+ Neues Rezept</button>
      </div>
    </div>
    <div class="searchbar" id="searchbar">
      <label for="q" class="visually-hidden">Rezepte durchsuchen</label>
      <input type="search" id="q" placeholder="Suchen: Name, Zutat, Sammlung …" autocomplete="off" autocorrect="off" spellcheck="false" enterkeyhint="search">
      <button type="button" class="clear" id="qClear" aria-label="Suche leeren" hidden>×</button>
    </div>
    <div class="status">
      <button type="button" class="btn filter-toggle" id="btnFilter" aria-expanded="true" aria-controls="filters">
        <span class="chev" aria-hidden="true">▾</span> Filter <span class="badge" id="filterBadge" hidden></span>
      </button>
      <span id="count" aria-live="polite"></span>
      <button type="button" class="btn-link" id="btnReset" hidden>Zurücksetzen</button>
      <label class="sort"><span class="visually-hidden">Sortieren</span><select id="sort" aria-label="Rezepte sortieren"></select></label>
    </div>
    <div class="filters" id="filters"></div>
  </header>

  <div class="banner" id="storageWarning" hidden>Achtung: Dieses Gerät erlaubt gerade kein dauerhaftes Speichern (zum Beispiel im privaten Fenster). Neue Rezepte gehen beim Schließen verloren.</div>

  <main>
    <div class="grid" id="grid"></div>
    <div class="empty" id="empty" hidden></div>
  </main>
</div>

<dialog id="dlg" aria-labelledby="dlgTitle">
  <div class="dlg-inner" id="dlgBody"></div>
</dialog>

<div class="toast" id="toast" role="status" aria-live="polite" hidden></div>
<!--APP-END-->
<script src="js/vendor/supabase.js"></script>
<script src="js/config.js"></script>
<script src="js/search.js"></script>
<script src="js/examples.js"></script>
<script src="js/scale.js"></script>
<script src="js/links.js"></script>
<script src="js/time.js"></script>
<script src="js/forms.js"></script>
<script src="js/substitutes.js"></script>
<script src="js/glossary.js"></script>
<script src="js/images.js"></script>
<script src="js/dupes.js"></script>
<script src="js/store.js"></script>
<script src="js/app.js"></script>
<script src="js/sync.js"></script>
</body>
</html>
