<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Meine Rezepte</title>
<meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)">
<meta name="app-version" content="2026-11-21T11:22:10">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Rezepte">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<link rel="icon" href="icons/icon-192.png">
<link rel="stylesheet" href="css/app.css">
</head>
<body>
<!--APP-START-->
<div class="app">
  <!-- Überschrift scrollt mit weg; stehen bleibt nur Suche + Filter -->
  <div class="titlebar">
    <div class="title-wrap">
      <h1>Rezepte</h1>
      <button type="button" class="sync-status" id="syncStatus" hidden aria-live="polite" title="Jetzt abgleichen"></button>
    </div>
    <div class="titlebar-actions">
      <button type="button" class="btn btn-quiet icon-only" id="btnCollections" aria-label="Einstellungen" title="Einstellungen"><span aria-hidden="true">⚙︎</span></button>
      <button type="button" class="btn btn-primary" id="btnImport" aria-label="Rezept hinzufügen">+ Hinzufügen</button>
    </div>
  </div>
  <header class="top" id="top">
    <div class="searchrow">
      <div class="searchbar" id="searchbar">
        <label for="q" class="visually-hidden">Rezepte durchsuchen</label>
        <input type="search" id="q" placeholder="Suchen: Name, Zutat …" autocomplete="off" autocorrect="off" spellcheck="false" enterkeyhint="search">
        <button type="button" class="clear" id="qClear" aria-label="Suche leeren" hidden>×</button>
      </div>
      <button type="button" class="btn filter-toggle" id="btnFilter" aria-expanded="true" aria-controls="filters">
        Filter <span class="badge" id="filterBadge" hidden></span><span class="chev" aria-hidden="true">▾</span>
      </button>
    </div>
    <div class="filters" id="filters"></div>
  </header>

  <div class="banner" id="storageWarning" hidden>Achtung: Dieses Gerät erlaubt gerade kein dauerhaftes Speichern (zum Beispiel im privaten Fenster). Neue Rezepte gehen beim Schließen verloren.</div>

  <main>
    <section class="start" id="start" hidden aria-labelledby="startTitle"></section>
    <div class="grid-tools status">
      <span id="count" aria-live="polite"></span>
      <button type="button" class="btn-link" id="btnReset" hidden>Zurücksetzen</button>
      <label class="sort"><span class="visually-hidden">Sortieren</span><select id="sort" aria-label="Rezepte sortieren"></select></label>
    </div>
    <div class="grid" id="grid"></div>
    <div class="empty" id="empty" hidden></div>
  </main>
</div>

<dialog id="dlg" aria-labelledby="dlgTitle">
  <div class="dlg-inner" id="dlgBody"></div>
</dialog>

<button type="button" class="to-top" id="toTop" aria-label="Nach oben" hidden>↑</button>

<div class="toast" id="toast" role="status" aria-live="polite" hidden></div>
<!--APP-END-->
<script>
/* Fehleranzeige: zeigt unerwartete Fehler sichtbar an, damit man sie melden kann */
(function () {
  function show(msg) {
    try {
      var el = document.getElementById('errorReport');
      if (!el) {
        el = document.createElement('div');
        el.id = 'errorReport';
        el.setAttribute('role', 'alert');
        el.style.cssText = 'position:fixed;left:8px;right:8px;bottom:calc(8px + env(safe-area-inset-bottom,0px));z-index:2147483647;background:#b3261e;color:#fff;padding:12px 14px;border-radius:12px;font:15px/1.4 -apple-system,system-ui,sans-serif;white-space:pre-wrap;word-break:break-word';
        el.addEventListener('click', function () { el.remove(); });
        (document.body || document.documentElement).appendChild(el);
      }
      el.textContent = 'Fehler (bitte Bildschirmfoto an Claude, Tippen schließt):\n' + msg + '\n' + navigator.userAgent;
    } catch (e) { /* nichts */ }
  }
  window.addEventListener('error', function (e) { show((e.message || 'Fehler') + (e.filename ? ' – ' + e.filename.split('/').pop() + ':' + e.lineno : '')); });
  window.addEventListener('unhandledrejection', function (e) { show('Promise: ' + (e.reason && (e.reason.message || e.reason) || 'unbekannt')); });
})();
</script>
